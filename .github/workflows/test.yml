name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # phlix-shared requires PHP ^8.3, so the matrix matches.
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      # phpunit.xml declares <report><cobertura outputFile="coverage.xml"/>, and
      # setup-php provides pcov above, so ./coverage.xml is written by the run
      # itself - no extra --coverage flag is needed.
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@6904bd01e29ada115135b5eca20125758ccae53b
        # Never allowed to fail the build: a missing/expired token or a Codacy
        # outage must not turn CI red.
        continue-on-error: true
        # One upload only - both matrix legs produce an identical report.
        if: matrix.php == '8.3'
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage.xml

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
